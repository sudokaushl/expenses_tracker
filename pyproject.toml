[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expenses-tracker"
version = "0.1.0"
description = "Bank transaction ingestion, source normalization, and category prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"pandas>=2.0",
	"duckdb>=0.8",
	"python-dotenv>=1.0",
	"nltk>=3.8",
	"rapidfuzz>=3.0",
	"pyyaml>=6.0",
	"pydantic>=2.0",
	"playwright>=1.64.1",
]

[project.optional-dependencies]
ml = [
	"numpy>=1.24",
	"sentence-transformers>=2.2",
	"scikit-learn>=1.3",
	"scipy>=1.10",
	"chromadb>=0.4",
	"tqdm>=4.65",
]
llm = ["langchain-openai>=0.0.2"]
statements = ["openpyxl>=3.1", "tabula-py>=2.9", "numpy>=1.24"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = [
	"numpy>=1.24",
	"sentence-transformers>=2.2",
	"scikit-learn>=1.3",
	"scipy>=1.10",
	"chromadb>=0.4",
	"tqdm>=4.65",
	"langchain-openai>=0.0.2",
	"openpyxl>=3.1",
	"tabula-py>=2.9",
]

[project.scripts]
expenses-tracker = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
